# 候选域名列表地址；默认源可在原始地址前加 HTTPS 加速前缀。
# 例如 https://gh-proxy.org/https://raw.githubusercontent.com/cmliu/CF-Pages-BestCF/main/cf_domains.txt
SOURCE_URL='https://raw.githubusercontent.com/cmliu/CF-Pages-BestCF/main/cf_domains.txt'
# Cloudflare 官方 IPv4 网段列表，候选 IP 必须属于此列表。
CF_IPV4_URL='https://www.cloudflare.com/ips-v4'
# 预留参数，当前脚本不会读取此项；测速端口由 URL 协议决定。
SPEED_HOST_PORT=443
# 测速后选择并同步的 IP 数量；合格数量不足时不会修改 DNS。
SELECT_COUNT=3
# 同时进行下载测速的 IP 数量；并发过高可能占满带宽。
SPEED_CONCURRENCY=3
# 最低下载速度（Mbps），合格 IP 达到 SELECT_COUNT 后停止后续测速。
MIN_SPEED_MBPS=40
# 获取候选列表前临时停止运行中的代理服务；默认关闭。名称须与 /etc/init.d/ 文件名一致。
# 可选服务：passwall passwall2 shadowsocksr clash openclash bypass v2raya
#           vssr homeproxy nikki shellcrash mihomo
# 多个服务名用空格分隔；实际名称以路由器上的文件名为准。
PAUSE_PROXY_SERVICES=false
PROXY_SERVICES='homeproxy'
# 下载测速文件地址，服务器须支持 HTTP 206 范围请求。
SPEEDTEST_URL='https://xn--e1a.eu.org/300.zip'
# 每个 IP 的测速下载上限，单位字节；4194304 等于 4 MiB。
SPEEDTEST_MAX_BYTES=4194304
# 每个 IP 下载测速的总超时时间，单位秒。
SPEEDTEST_TIMEOUT=30
# 建立网络连接的超时时间，单位秒。
CONNECT_TIMEOUT=4
# Cloudflare API Token，需具有目标区域 DNS 编辑权限。
CF_API_TOKEN=''
# Cloudflare 区域 ID（Zone ID）。
CF_ZONE_ID=''
# 要同步 A 记录的完整域名，例如 best.example.com。
DNS_RECORD_NAME=''
# 必须为 false（仅 DNS）；脚本新建的记录使用 60 秒 TTL。
CF_PROXIED='false'
# 脚本管理的 DNS 记录备注；仅相同备注的旧记录可被删除。
MANAGED_COMMENT='managed-by-openwrt-cf-dns-sync'
# 企业微信自建应用通知；不需要时将以下凭据留空。
# 企业 ID。
WECHAT_CORPID=''
# 自建应用的 Secret，注意保密。
WECHAT_SECRET=''
# 自建应用的数字 AgentId。
WECHAT_AGENTID=''
# 接收通知的成员 UserID，@all 表示应用可见范围内的所有成员。
WECHAT_TOUSER='@all'
# 日志文件；OpenWrt 的 /tmp 通常在重启后清空。
LOG_FILE='/tmp/openwrt-cf-dns-sync.log'
# 并发锁目录，同一目录用于阻止任务同时运行。
LOCK_DIR='/tmp/openwrt-cf-dns-sync.lock'
# 下载列表和请求 API 的总超时时间，单位秒。
HTTP_TIMEOUT=20

